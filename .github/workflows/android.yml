name: TurnikMan — APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    name: Собрать подписанный APK + AAB
    runs-on: ubuntu-24.04
    env:
      # Размер балластного пака в МБ. 0 — обычная лёгкая сборка.
      # Меняется без правки кода: gh variable set PAD_MB --body 256
      PAD_MB: ${{ vars.PAD_MB || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Зависимости JS
        run: npm ci

      - name: Проверки (физика, контент, headless-прогон)
        run: npm test

      - name: Собрать одностраничную версию
        run: npm run build

      - name: Скопировать веб-часть в Android-проект
        run: npx cap sync android

      - name: Добавить балластный пак (если PAD_MB > 0)
        if: env.PAD_MB != '0'
        run: |
          set -e
          PAD_DIR=android/app/src/main/assets/pad
          mkdir -p "$PAD_DIR"
          dd if=/dev/urandom of="$PAD_DIR/pad.bin" bs=1M count="$PAD_MB" status=none
          cat > "$PAD_DIR/README.txt" <<'TXT'
          Балластный пак TurnikMan.
          Это не игровые данные: файл нужен только для увеличения размера APK.
          Игра его не читает и не загружает — на геймплей он не влияет.
          Убрать: gh variable set PAD_MB --body 0 и пересобрать.
          TXT
          ls -lh "$PAD_DIR"
          echo "балласт: ${PAD_MB} МБ"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Сборка release APK и AAB
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Собрать итоговые файлы
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/turnikman.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/turnikman.aab
          cp dist/TurnikMan.html out/TurnikMan.html
          ls -lh out
          sha256sum out/*

      - name: Проверить, что игра реально внутри APK
        run: |
          set -e
          APK=out/turnikman.apk
          unzip -l "$APK" | grep -q "assets/public/index.html" || { echo "✗ в APK нет веб-части"; exit 1; }
          unzip -l "$APK" | grep -q "assets/public/app.js"      || { echo "✗ в APK нет app.js"; exit 1; }
          unzip -l "$APK" | grep -q "assets/public/vendor/three.module.js" || { echo "✗ в APK нет three.js"; exit 1; }
          unzip -l "$APK" | grep -q "classes.dex" || { echo "✗ в APK нет classes.dex"; exit 1; }
          echo "✓ веб-часть и код на месте:"
          unzip -l "$APK" | grep -E "assets/public/(index.html|app.js|styles.css|vendor)" | head -10
          if [ "${PAD_MB}" != "0" ]; then
            unzip -l "$APK" | grep -q "assets/pad/pad.bin" || { echo "✗ балласт не попал в APK"; exit 1; }
            echo "✓ балласт на месте: $(unzip -l "$APK" | grep 'assets/pad/pad.bin' | awk '{printf "%.0f МБ", $1/1048576}')"
          fi
          echo "✓ размер APK: $(du -h "$APK" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: turnikman-android
          path: out/*
          retention-days: 90

      - name: Опубликовать релиз со сборкой
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: TurnikMan — сборка ${{ github.run_number }}
          body: |
            Установочный файл TurnikMan для Android.

            Размер этой сборки увеличен балластным паком (`PAD_MB`): внутри APK лежит
            неиспользуемый файл, игра его не читает. На геймплей не влияет —
            убрать можно переменной репозитория `PAD_MB=0`.

            **Как поставить:** скачайте `turnikman.apk` на телефоне → откройте файл →
            разрешите установку из неизвестных источников для браузера/файлового менеджера → «Установить».

            `TurnikMan.html` — та же игра одним файлом, открывается в браузере без установки.
            `turnikman.aab` — для загрузки в магазины приложений.

            Подпись: публичный тестовый ключ (см. `android/keystore.properties`).
          files: |
            out/turnikman.apk
            out/turnikman.aab
            out/TurnikMan.html
          fail_on_unmatched_files: true
