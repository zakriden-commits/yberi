name: Android APK
on:
  push:
    branches: [arena/ac6d51f8-yberi]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager 2>/dev/null | head -1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true
          fi
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Configure Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          chmod +x android/gradlew
          sed -i 's/gradle-8.11.1-all.zip/gradle-8.11.1-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle.log 2>&1 || (tail -120 ../gradle.log; exit 1)
      - name: Report failure to commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f gradle.log ]; then
            node -e "const fs=require('fs');const body='Gradle log tail:\\n\\n```\\n'+fs.readFileSync('gradle.log','utf8').slice(-50000)+'\\n```';fs.writeFileSync('comment.json',JSON.stringify({body}))"
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input comment.json || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: gradle.log
      - uses: actions/upload-artifact@v4
        with:
          name: DeniIslam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
