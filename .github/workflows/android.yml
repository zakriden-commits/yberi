name: Android APK
on:
  push:
    branches: [arena/ac6d51f8-yberi]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager 2>/dev/null | head -1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" || true
          fi
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Configure Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          chmod +x android/gradlew
          sed -i 's/gradle-8.11.1-all.zip/gradle-8.11.1-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle.log 2>&1 || {
            tail -120 ../gradle.log
            while IFS= read -r line; do echo "::error title=Gradle::$line"; done < <(sed -n '/What went wrong/,/Try:/p' ../gradle.log | head -n 30)
            while IFS= read -r line; do echo "::error title=GradleCause::$line"; done < <(grep 'Caused by:' ../gradle.log | head -n 10)
            exit 1
          }
      - name: Commit APK to repo
        if: success()
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/DeniIslam-debug.apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apk/DeniIslam-debug.apk
          git commit -m "Add debug APK [skip ci]" || true
          git push origin HEAD:arena/ac6d51f8-yberi
      
