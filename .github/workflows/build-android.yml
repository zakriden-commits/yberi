name: Build Android APK

on:
  push:
    branches:
      - main
      - arena/3da8b26a-yberi
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy the game into the Android app
        run: |
          mkdir -p android/app/src/main/assets/www/assets android/app/src/main/assets/www/icons
          cp index.html styles.css app.js manifest.webmanifest service-worker.js icon.svg android/app/src/main/assets/www/
          cp assets/* android/app/src/main/assets/www/assets/
          cp icons/* android/app/src/main/assets/www/icons/

      - name: Build installable debug APK
        run: gradle --no-daemon --project-dir android :app:assembleDebug

      - name: Give the APK a friendly filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Sasny-Nurmadog.apk

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sasny-Nurmadog-Android-APK
          path: android/app/build/outputs/apk/debug/Sasny-Nurmadog.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish a downloadable GitHub release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/arena/3da8b26a-yberi'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" android/app/build/outputs/apk/debug/Sasny-Nurmadog.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Сасный Нурмадог — APK #${GITHUB_RUN_NUMBER}" \
            --notes "Устанавливаемая Android-версия игры. Сборка подписана тестовым debug-ключом; разреши установку приложения из этого источника, если Android спросит." \
            --prerelease
