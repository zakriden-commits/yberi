<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>TurnikMan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0d1117" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
/* ================= TurnikMan ================= */
:root {
  --ink: #0d1117;
  --panel: rgba(12, 17, 24, .92);
  --panel-2: rgba(20, 28, 38, .96);
  --line: rgba(255,255,255,.10);
  --text: #f2f6fa;
  --dim: #93a4b5;
  --lime: #c6ff3d;
  --orange: #ff8a3d;
  --blue: #4db8ff;
  --red: #ff4d5e;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0; height: 100%; overflow: hidden;
  background: var(--ink); color: var(--text);
  font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
  user-select: none; -webkit-user-select: none;
  touch-action: none; overscroll-behavior: none;
}

#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; }

.hidden { display: none !important; }

/* ================= общее ================= */
.overlay {
  position: fixed; inset: 0; z-index: 10;
  display: flex; flex-direction: column;
  padding: calc(var(--safe-top) + 14px) 16px calc(var(--safe-bottom) + 18px);
  pointer-events: none;
}
.overlay > * { pointer-events: auto; }

.icon-btn {
  width: 42px; height: 42px;
  display: grid; place-items: center;
  font-size: 19px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--panel);
  color: var(--text);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.icon-btn.small { width: 38px; height: 38px; font-size: 16px; }
.icon-btn:active { transform: scale(.95); }

.main-btn {
  width: 100%;
  padding: 19px;
  border: none; border-radius: 18px;
  background: linear-gradient(180deg, #d4ff5c, #9be000);
  color: #14210a;
  font: inherit; font-size: 22px; font-weight: 900; letter-spacing: 3px;
  box-shadow: 0 7px 0 #5f8c00, 0 14px 30px rgba(0,0,0,.4);
}
.main-btn:active { transform: translateY(4px); box-shadow: 0 3px 0 #5f8c00; }

.sub-btn {
  flex: 1;
  padding: 14px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: var(--panel);
  color: var(--text);
  font: inherit; font-size: 14px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
}
.sub-btn:active { transform: scale(.97); }

/* ================= лобби ================= */
.top-row { display: flex; align-items: center; justify-content: space-between; }
.coins {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 14px; border-radius: 12px;
  background: var(--panel); border: 1.5px solid var(--line);
  font-size: 17px; font-weight: 900;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.coins b { color: var(--lime); }

.brand { margin-top: auto; margin-bottom: auto; text-align: center; }
.brand-title {
  font-size: clamp(42px, 14vw, 74px);
  font-weight: 900; letter-spacing: 1px; line-height: .95;
  color: #fff;
  text-shadow: 0 5px 0 rgba(0,0,0,.45), 0 0 40px rgba(198,255,61,.25);
}
.brand-title span { color: var(--lime); }
.brand-sub {
  margin-top: 8px; font-size: 11px; letter-spacing: 5px; text-transform: uppercase; color: var(--dim);
}

.lobby-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 11px; width: 100%; max-width: 520px; align-self: center; }
.lobby-row { display: flex; gap: 10px; }
.best-line { text-align: center; font-size: 12px; color: var(--dim); letter-spacing: 1.5px; text-transform: uppercase; }
.best-line b { color: var(--text); }

/* ================= HUD ================= */
.hud { position: fixed; inset: 0; z-index: 12; pointer-events: none; padding: calc(var(--safe-top) + 12px) 14px; }
.hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
.hud-score {
  font-size: 38px; font-weight: 900; letter-spacing: 1px;
  color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.5), 0 0 22px rgba(198,255,61,.4);
  font-variant-numeric: tabular-nums;
}
.hud .icon-btn { pointer-events: auto; }

.trick-popup {
  position: absolute; left: 0; right: 0; top: 27%;
  text-align: center;
  font-size: 21px; font-weight: 900; letter-spacing: 2px;
  color: var(--lime);
  text-shadow: 0 3px 0 rgba(0,0,0,.55), 0 0 26px rgba(198,255,61,.6);
  opacity: 0; transform: scale(.85);
  transition: opacity .18s ease, transform .18s ease;
}
.trick-popup.show { opacity: 1; transform: scale(1); }

.hint {
  position: absolute; left: 0; right: 0; bottom: calc(var(--safe-bottom) + 128px);
  text-align: center; font-size: 11.5px; letter-spacing: 1.2px; color: rgba(255,255,255,.65);
  text-transform: uppercase;
  transition: opacity .5s ease;
}
.hint.fade { opacity: 0; }

/* ================= контролы ================= */
.controls {
  position: fixed; left: 10px; right: 10px; bottom: calc(var(--safe-bottom) + 10px);
  z-index: 14;
  display: flex; gap: 9px;
}
.ctrl-btn {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 12px 6px 13px;
  border-radius: 17px;
  border: 1.5px solid var(--line);
  background: rgba(12, 17, 24, .8);
  color: var(--text);
  font: inherit;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: transform .07s ease, background .1s ease;
}
.ctrl-btn .ctrl-icon { font-size: 21px; line-height: 1; }
.ctrl-btn .ctrl-label { font-size: 10.5px; font-weight: 900; letter-spacing: 1.4px; }
.ctrl-btn.pressed { background: rgba(198,255,61,.22); border-color: rgba(198,255,61,.6); transform: scale(.97); }
.ctrl-btn.pump { background: rgba(198,255,61,.13); border-color: rgba(198,255,61,.36); }
.ctrl-btn.action { flex: 1.15; background: rgba(255,138,61,.18); border-color: rgba(255,138,61,.45); }
.ctrl-btn.action.pressed { background: rgba(255,138,61,.4); }
.ctrl-btn.tuck { background: rgba(77,184,255,.16); border-color: rgba(77,184,255,.4); }
.ctrl-btn.tuck.pressed { background: rgba(77,184,255,.4); }

/* ================= результат ================= */
.result {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  background: rgba(5, 8, 12, .72);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.result-card {
  width: min(88vw, 360px);
  padding: 22px;
  border-radius: 22px;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1.5px solid var(--line);
  text-align: center;
  display: flex; flex-direction: column; gap: 10px;
}
.result-title { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--dim); }
.result-score { font-size: 52px; font-weight: 900; color: var(--lime); line-height: 1; }
.result-coins { font-size: 15px; color: var(--text); }
.result-coins b { color: var(--lime); }

/* ================= шторки ================= */
.sheet-wrap {
  position: fixed; inset: 0; z-index: 30;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(4, 7, 11, .6);
  animation: fadeIn .16s ease;
}
.sheet {
  width: 100%; max-width: 560px;
  max-height: 88vh;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1.5px solid var(--line);
  border-bottom: none;
  border-radius: 22px 22px 0 0;
  padding-bottom: var(--safe-bottom);
  animation: sheetUp .24s cubic-bezier(.2,1,.3,1);
}
.sheet.small { max-width: 460px; }
@keyframes sheetUp { from { transform: translateY(36px); opacity: .7 } to { transform: none; opacity: 1 } }

.sheet-head {
  display: flex; align-items: center; gap: 10px;
  padding: 15px 15px 11px;
  border-bottom: 1px solid var(--line);
}
.sheet-head h2 { margin: 0; font-size: 15px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text); }
.sheet-coins { margin-left: auto; font-size: 13px; color: var(--dim); }
.sheet-coins b { color: var(--lime); }
.sheet-close {
  width: 32px; height: 32px; margin-left: auto;
  border-radius: 10px; border: 1px solid var(--line);
  background: rgba(255,255,255,.05); color: var(--text); font-size: 14px;
}
.sheet-body {
  padding: 13px 13px 20px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 9px;
  -webkit-overflow-scrolling: touch;
}

/* карта */
.map-card {
  display: flex; align-items: center; gap: 12px;
  padding: 13px; border-radius: 16px;
  border: 1.5px solid var(--line);
  background: rgba(255,255,255,.04);
}
.map-card.active { border-color: var(--lime); background: rgba(198,255,61,.10); }
.map-swatch { width: 44px; height: 44px; border-radius: 12px; flex: 0 0 auto; border: 1px solid rgba(255,255,255,.16); }
.map-info { flex: 1; min-width: 0; }
.map-name { font-size: 15px; font-weight: 900; }
.map-desc { font-size: 11.5px; color: var(--dim); margin-top: 3px; line-height: 1.35; }
.map-tag {
  flex: 0 0 auto; font-size: 9.5px; font-weight: 900; letter-spacing: 1.2px; text-transform: uppercase;
  padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,.09); color: var(--dim);
}
.map-card.active .map-tag { background: var(--lime); color: #14210a; }

/* скин */
.skin-card {
  display: flex; align-items: center; gap: 12px;
  padding: 11px; border-radius: 16px;
  border: 1.5px solid var(--line);
  background: rgba(255,255,255,.04);
}
.skin-card.active { border-color: var(--lime); background: rgba(198,255,61,.08); }
.skin-card.owned .skin-price { color: var(--dim); }
.skin-avatar {
  width: 46px; height: 46px; flex: 0 0 auto; border-radius: 12px;
  display: grid; place-items: center;
  font-size: 21px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
}
.skin-info { flex: 1; min-width: 0; }
.skin-name { font-size: 14.5px; font-weight: 900; }
.skin-desc { font-size: 11px; color: var(--dim); margin-top: 2px; }
.skin-price { font-size: 12px; color: var(--lime); font-weight: 800; margin-top: 3px; }

.buy-btn {
  flex: 0 0 auto; min-width: 88px;
  padding: 11px 10px;
  border: none; border-radius: 12px;
  background: linear-gradient(180deg, #d4ff5c, #9be000);
  color: #14210a; font: inherit; font-size: 12.5px; font-weight: 900;
  box-shadow: 0 4px 0 #5f8c00;
}
.buy-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #5f8c00; }
.buy-btn:disabled { background: rgba(255,255,255,.08); color: rgba(255,255,255,.35); box-shadow: none; }
.buy-btn.equipped { background: rgba(198,255,61,.16); color: var(--lime); box-shadow: none; }

/* настройки */
.slider-row {
  display: grid; grid-template-columns: 92px 1fr 34px;
  align-items: center; gap: 12px;
  font-size: 13px; font-weight: 700;
}
.slider-row b { text-align: right; color: var(--lime); font-size: 12px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track { height: 7px; border-radius: 99px; background: rgba(255,255,255,.15); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 22px; height: 22px; margin-top: -7.5px; border-radius: 50%;
  background: #fff; border: 3px solid #7fa800;
}
input[type=range]::-moz-range-track { height: 7px; border-radius: 99px; background: rgba(255,255,255,.15); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid #7fa800; }

.ghost-btn {
  width: 100%; padding: 12px; border-radius: 12px;
  border: 1px solid var(--line); background: rgba(255,255,255,.05);
  color: var(--text); font: inherit; font-size: 13px; font-weight: 700;
}
.ghost-btn.danger { color: var(--red); border-color: rgba(255,77,94,.35); }

/* тосты */
.toasts {
  position: fixed; top: calc(var(--safe-top) + 70px); left: 0; right: 0;
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  pointer-events: none; z-index: 40;
}
.toast {
  background: rgba(9, 13, 19, .94);
  border: 1.5px solid rgba(198,255,61,.45);
  color: var(--text);
  padding: 9px 15px; border-radius: 99px;
  font-size: 12.5px; font-weight: 800;
  animation: toastIn .28s cubic-bezier(.2,1.4,.4,1), toastOut .3s ease 1.8s forwards;
}
.toast.bad { border-color: rgba(255,77,94,.5); }
@keyframes toastIn { from { transform: translateY(-12px) scale(.94); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes toastOut { to { transform: translateY(-8px); opacity: 0 } }

@media (min-width: 720px) {
  .sheet-wrap { align-items: center; }
  .sheet { border-radius: 22px; border-bottom: 1.5px solid var(--line); max-height: 82vh; }
  .controls, .lobby-bottom { max-width: 560px; margin-left: auto; margin-right: auto; }
  .controls { left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 20px)); }
}

</style>
</head>
<body>

<div id="stage"></div>

<!-- ================= лобби ================= -->
<div id="lobby" class="overlay">
  <div class="top-row">
    <div class="coins"><span>🪙</span> <b id="coinsValue">0</b></div>
    <button id="settingsBtn" class="icon-btn" aria-label="Настройки">⚙</button>
  </div>

  <div class="brand">
    <div class="brand-title">TURNIK<span>MAN</span></div>
    <div class="brand-sub">физика турника</div>
  </div>

  <div class="lobby-bottom">
    <div class="best-line">Рекорд: <b id="bestValue">0</b></div>
    <button id="playBtn" class="main-btn">ИГРАТЬ</button>
    <div class="lobby-row">
      <button id="mapsBtn" class="sub-btn">Карты</button>
      <button id="skinsBtn" class="sub-btn">Скины</button>
    </div>
  </div>
</div>

<!-- ================= HUD в игре ================= -->
<div id="hud" class="hud hidden">
  <div class="hud-top">
    <div class="hud-score"><span id="scoreValue">0</span></div>
    <button id="pauseBtn" class="icon-btn small" aria-label="Пауза">⏸</button>
  </div>
  <div id="trickPopup" class="trick-popup"></div>
  <div id="hint" class="hint">держи слева — мах · справа — группировка</div>
</div>

<div id="controls" class="controls hidden">
  <button id="pumpBtn" class="ctrl-btn pump">
    <span class="ctrl-icon">↻</span><span class="ctrl-label">МАХ</span>
  </button>
  <button id="actionBtn" class="ctrl-btn action">
    <span class="ctrl-icon">✋</span><span class="ctrl-label" id="actionLabel">ОТПУСТИТЬ</span>
  </button>
  <button id="tuckBtn" class="ctrl-btn tuck">
    <span class="ctrl-icon">◉</span><span class="ctrl-label">ГРУППА</span>
  </button>
</div>

<!-- ================= результат ================= -->
<div id="result" class="result hidden">
  <div class="result-card">
    <div class="result-title" id="resultTitle">ПРИЗЕМЛЕНИЕ</div>
    <div class="result-score" id="resultScore">0</div>
    <div class="result-coins">+<b id="resultCoins">0</b> 🪙</div>
    <button id="againBtn" class="main-btn">ДАЛЬШЕ</button>
  </div>
</div>

<!-- ================= карты ================= -->
<div id="mapsSheet" class="sheet-wrap hidden">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Карты</h2>
      <button class="sheet-close" data-close="mapsSheet">✕</button>
    </div>
    <div class="sheet-body" id="mapsList"></div>
  </div>
</div>

<!-- ================= скины ================= -->
<div id="skinsSheet" class="sheet-wrap hidden">
  <div class="sheet">
    <div class="sheet-head">
      <h2>Скины</h2>
      <div class="sheet-coins">🪙 <b id="skinsCoins">0</b></div>
      <button class="sheet-close" data-close="skinsSheet">✕</button>
    </div>
    <div class="sheet-body" id="skinsList"></div>
  </div>
</div>

<!-- ================= настройки ================= -->
<div id="settingsSheet" class="sheet-wrap hidden">
  <div class="sheet small">
    <div class="sheet-head">
      <h2>Настройки</h2>
      <button class="sheet-close" data-close="settingsSheet">✕</button>
    </div>
    <div class="sheet-body">
      <label class="slider-row"><span>🎵 Музыка</span>
        <input id="musicRange" type="range" min="0" max="100" value="40" /><b id="musicVal">40</b></label>
      <label class="slider-row"><span>🔊 Звуки</span>
        <input id="sfxRange" type="range" min="0" max="100" value="75" /><b id="sfxVal">75</b></label>
      <button id="muteBtn" class="ghost-btn">Выключить звук</button>
      <button id="resetBtn" class="ghost-btn danger">Сбросить прогресс</button>
    </div>
  </div>
</div>

<div id="toasts" class="toasts"></div>
